name: marquee
services:
  marquee:
    image: ghcr.io/persian86/marquee:latest
    container_name: marquee
    restart: unless-stopped
    ports:
      - "8420:8420"
      - "8421:8421"
    environment:
      TZ: Australia/Melbourne
      HWACCEL: none
      MAX_TRANSCODES: "3"
      SCAN_INTERVAL_MIN: "30"
    volumes:
      - /DATA/AppData/marquee/config:/config
      - /DATA/AppData/marquee/transcode:/transcode
      - "/DATA/MediaStorage/PlexMedia/Movies:/media/movies:ro"
      - "/DATA/MediaStorage/PlexMedia/Tv Shows:/media/tv:ro"
      - "/DATA/MediaStorage/PlexMedia/Zoey Movies:/media/zoey-movies:ro"
      - "/DATA/MediaStorage/PlexMedia/Zoey Tv Shows:/media/zoey-tv:ro"
    x-casaos:
      ports:
        - container: "8420"
          description:
            en_us: Web UI

x-casaos:
  architectures:
    - amd64
  main: marquee
  author: Adam
  developer: Adam
  category: Media
  title:
    en_us: Marquee
  tagline:
    en_us: Your family's movies and TV, anywhere
  index: /
  port_map: "8420"
  scheme: http
