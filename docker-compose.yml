name: marquee
services:
  marquee:
    # Built by GitHub Actions. Image name is already set for this repo.
    image: ghcr.io/persian86/marquee:latest
    container_name: marquee
    restart: unless-stopped
    ports:
      - "8420:8420"
      - "8421:8421"
    environment:
      TZ: Australia/Melbourne
      HWACCEL: vaapi
      MAX_TRANSCODES: "3"
      SCAN_INTERVAL_MIN: "30"
    devices:
      - /dev/dri:/dev/dri
    volumes:
      # Left side is the Fygo folder. In Files, note the real path and replace these.
      - /volume1/AppData/marquee/config:/config
      - /volume1/AppData/marquee/transcode:/transcode
      - /volume1/Media/Movies:/media/movies:ro
      - /volume1/Media/TV Shows:/media/tv:ro
      - /volume1/Media/Music:/media/music:ro
      - /volume1/Media/Photos:/media/photos:ro
      - /volume1/Media/Home Videos:/media/home-videos:ro
