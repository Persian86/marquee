name: Ghost playback checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  playback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check server/features/assistant.js && node --check server/features/devices.js && node --check server/routes/ext.js && node --check public/js/boot.js
      - name: Check playback JavaScript
        run: |
          for file in public/js/playback-quality.js public/js/player.js public/js/admin.js public/js/downloads.js public/sw.js server/common.js server/stream.js server/routes/core.js server/routes/admin.js server/features/cast.js server/features/versions.js; do node --check "$file"; done
      - name: Install video conversion test dependency
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Test voice playback and fixed resolution
        run: node --test tests/ghost.test.js tests/quality.test.js
